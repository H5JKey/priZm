<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои проекты — 3D Render</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-cube"></i>
                    <span>3D Render</span>
                </div>
                <nav class="nav">
                    <a href="index.html"><i class="fas fa-home"></i> Главная</a>
                    <a href="create.html"><i class="fas fa-plus-circle"></i> Создать</a>

                    <div class="avatar-dropdown">
                        <button class="avatar-btn" id="avatarBtn" onclick="toggleMenu()">
                            <i class="fas fa-user-circle"></i>
                        </button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="profile.html" class="dropdown-item">
                                <i class="fas fa-user"></i> Мой профиль
                            </a>
                            <a href="my-projects.html" class="dropdown-item">
                                <i class="fas fa-project-diagram"></i> Мои проекты
                            </a>
                            <hr class="dropdown-divider">
                            <button class="dropdown-item dropdown-danger" id="logoutBtn">
                                <i class="fas fa-sign-out-alt"></i> Выйти
                            </button>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="page-header">
                <h1><i class="fas fa-folder-open"></i> Мои проекты</h1>
                <p class="subtitle">Все ваши проекты в одном месте</p>
            </div>

            <div id="myProjectsContainer">
                <div id="loading" class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Загрузка...
                </div>
                <div id="myProjectsGrid" class="projects-grid"></div>
            </div>

            <div class="pagination" id="pagination">
                <button id="prevPage" class="btn btn-secondary" disabled>
                    <i class="fas fa-chevron-left"></i> Назад
                </button>
                <button id="nextPage" class="btn btn-secondary">
                    Вперед <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
